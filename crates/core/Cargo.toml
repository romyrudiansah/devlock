[package]
name = "devlock-core"
description = "Logika inti DevLock: path, konfigurasi, runtime, resolver, service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["net"]
# Download katalog & runtime. Dimatikan untuk shim agar binary tetap kecil.
net = ["dep:ureq", "dep:sha2", "dep:sha1", "dep:zip", "dep:getrandom", "dep:flate2", "dep:tar"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
ureq = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
# Arsip .tar.gz (build Python portable).
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
# Sertifikat HTTPS lokal (CA DevLock + sertifikat per site).
rcgen = { version = "0.13", features = ["x509-parser"] }
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
tempfile.workspace = true
x509-parser = { version = "0.16", features = ["verify"] }
