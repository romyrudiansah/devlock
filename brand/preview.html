<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Logo DevLock</title>
<style>
  body { margin: 0; padding: 24px; font: 15px system-ui, sans-serif; background: #f6f7f9; color: #1c2330; }
  h2 { font-size: 14px; color: #5d6573; margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; gap: 24px; align-items: end; margin-bottom: 26px; flex-wrap: wrap; }
  .dark { background: #0d1218; color: #e5e9f0; padding: 20px; border-radius: 12px; }
  .lockup { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 30px; letter-spacing: -0.01em; }
  .taskbar { display: flex; gap: 10px; align-items: center; background: #202020; padding: 8px 14px; border-radius: 8px; }
  .taskbar.light { background: #f3f3f3; }
</style>
</head>
<body>
  <h2>Logo (tanpa kotak)</h2>
  <div class="row">
    <img src="logo-mark.svg" height="160" alt="">
    <div class="lockup"><img src="logo-mark.svg" height="40" alt="">DevLock</div>
  </div>
  <div class="row dark">
    <img src="logo-mark.svg" height="96" alt="">
    <div class="lockup"><img src="logo-mark.svg" height="40" alt="">DevLock</div>
  </div>
  <h2>Ikon aplikasi (tile)</h2>
  <div class="row">
    <img src="logo-app.svg" width="160" alt="">
    <img src="logo-app.svg" width="64" alt="">
    <img src="logo-app.svg" width="48" alt="">
    <img src="logo-app.svg" width="32" alt="">
    <img src="logo-app.svg" width="24" alt="">
    <img src="logo-app.svg" width="16" alt="">
  </div>
  <div class="row">
    <div class="taskbar"><img src="logo-app.svg" width="24"><img src="logo-app.svg" width="16"></div>
    <div class="taskbar light"><img src="logo-app.svg" width="24"><img src="logo-app.svg" width="16"></div>
  </div>
</body>
</html>
