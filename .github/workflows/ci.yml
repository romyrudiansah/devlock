name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build frontend GUI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all -- --check
      # Fitur yang sama dengan build rilis, agar konfigurasi rilis ikut dicek di setiap PR.
      - run: cargo clippy --workspace --all-targets --features devlock-desktop/custom-protocol -- -D warnings
      - run: cargo test --workspace
