[package]
name = "devlock-desktop"
description = "GUI DevLock (tray + dashboard)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "devlock-gui"
path = "src/main.rs"

[features]
# Muat UI dari aset yang disisipkan ke exe, bukan dari dev server `build.devUrl`.
# `tauri build` mengaktifkannya otomatis; build dengan `cargo` langsung harus menyalakannya
# sendiri (lihat workflow rilis), jika tidak exe akan mencari http://localhost:1420.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
devlock-core = { workspace = true, features = ["net"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
