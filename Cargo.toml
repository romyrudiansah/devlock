[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.15.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/romyrudiansah/devlock"
license = "MIT OR Apache-2.0"
authors = ["Romy Rudiansah"]

[workspace.dependencies]
devlock-core = { path = "crates/core", default-features = false }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
